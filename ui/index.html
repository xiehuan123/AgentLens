<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentLens</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<header><img class="brand-mark" src="icon.png" alt="" width="32" height="32"><strong>AgentLens</strong><span class="badge" id="mode-label">演示模式 · 模拟日志</span><button id="mode">浏览本机会话</button><button id="language">English</button></header>
<div class="layout">
<aside class="side" aria-label="会话" data-aria="会话"><h2 data-label="会话">会话</h2><div class="filters"><input id="project" placeholder="筛选项目" aria-label="筛选项目" data-aria="筛选项目"><select id="provider" aria-label="代理来源" data-aria="代理来源"><option value="" data-label="所有来源">所有来源</option><option>Codex</option><option>Claude Code</option><option>ChatGPT</option></select></div><section id="folders" class="folder-settings" hidden>
  <button type="button" id="folder-toggle" class="folder-toggle" aria-controls="folder-options" aria-expanded="false"><span data-label="目录设置">目录设置</span></button>
  <div id="folder-options" hidden>
    <button type="button" id="codex-folder" data-label="添加 Codex 日志目录">添加 Codex 日志目录</button>
    <button type="button" id="claude-folder" data-label="添加 Claude Code 日志目录">添加 Claude Code 日志目录</button>
    <p id="folder-status" role="status" hidden></p>
  </div>
</section><button id="import-chatgpt" class="import-chatgpt" data-label="导入 ChatGPT 聊天" hidden>导入 ChatGPT 聊天</button><p id="import-status" class="import-status" role="status" hidden></p><div id="sessions"></div><p class="tip" data-label="从失败步骤出发，能否快速找到相关修改并看见重跑结果？选一个会话试走一遍。">从失败步骤出发，能否快速找到相关修改并看见重跑结果？选一个会话试走一遍。</p></aside>
<main>
<div class="top"><h1 id="title"></h1><p class="muted" id="meta" aria-live="polite"></p><div class="toolbar"><button id="play" class="primary">播放后续日志</button><button id="next" data-label="单步写入">单步写入</button><button id="reset" data-label="重置">重置</button><button id="failed" aria-pressed="false" data-label="只看失败">只看失败</button><button id="diagnostics" data-label="排查会话">排查会话</button><button id="file" hidden></button></div></div>
<div id="activity-filter" class="activity-filter" aria-label="执行轨迹" data-aria="执行轨迹"></div>
<div class="timeline-panel"><div id="timeline" class="scroll" aria-label="执行时间线" data-aria="执行时间线"><div id="steps"></div></div><button id="jump" class="jump primary" hidden></button></div>
</main>
<aside class="detail" aria-label="步骤详情" data-aria="步骤详情"><section id="detail"></section><section id="usage" hidden></section></aside>
</div>
<dialog id="diagnostics-dialog" class="diagnostics-dialog" aria-labelledby="diagnostics-heading">
  <div class="diagnostics-header"><h2 id="diagnostics-heading" data-label="排查会话">排查会话</h2><form method="dialog"><button data-label="关闭">关闭</button></form></div>
  <nav id="diagnostics-tabs" class="diagnostics-tabs"></nav>
  <div id="diagnostics-content" class="diagnostics-content"></div>
</dialog>
<script src="requests.js"></script>
<script src="app.js"></script>
<script src="diagnostics.js"></script>
</html>
