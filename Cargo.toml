[package]
name = "agentlens"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tauri-plugin-dialog = "2"
tempfile = "3"
zstd = "0.13"

[features]
custom-protocol = ["tauri/custom-protocol"]
