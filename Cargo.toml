[package]
name = "agentlens"
version = "0.3.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tauri-plugin-dialog = "2"
tempfile = "3"
zstd = "0.13"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
toml = "0.9"
yaml-rust2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
