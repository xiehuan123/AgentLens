<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentLens · 交互原型</title>
<style>
:root{font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#222730;background:#f4f5f8;--line:#e5e7ee;--muted:#676d7d;--accent:#5046c5}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:white;border:1px solid var(--line);border-radius:8px;padding:7px 11px}button:hover{border-color:#9c94ec}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true]{border-color:#a49ceb;background:#efedff;color:#4539ae}
header{height:59px;border-bottom:1px solid var(--line);background:white;display:flex;align-items:center;gap:12px;padding:0 22px}.mark{width:28px;height:28px;display:grid;place-items:center;background:#262344;color:white;border-radius:8px;font-weight:700}.badge{padding:2px 8px;background:#eeecff;color:#4539ae;border-radius:6px;font-size:12px}.header-note{margin-left:auto;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:235px minmax(340px,1fr) minmax(295px, .65fr);height:calc(100dvh - 59px);min-height:510px}.side,.detail{background:white;padding:19px;overflow:auto}.side{border-right:1px solid var(--line)}.detail{border-left:1px solid var(--line)}h1,h2,p{margin:0}h1{font-size:23px;letter-spacing:-.5px}h2{font-size:15px}.muted,small{color:var(--muted)}small{font-size:12px}.filters{display:grid;gap:8px;margin:14px 0}.filters input,.filters select{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:white}.session{width:100%;text-align:left;margin-bottom:7px;display:grid;gap:3px}.session strong{overflow-wrap:anywhere}.source{font-size:11px;color:var(--muted)}.tip{margin-top:20px;padding:12px;background:#f7f7fb;border-radius:10px;color:var(--muted);font-size:12px}
main{min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}.top{padding:19px 20px 11px;border-bottom:1px solid var(--line);background:#f8f8fb}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.scroll{overflow:auto;padding:17px 20px 58px;flex:1;min-height:0}.step{display:grid;grid-template-columns:29px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;margin:8px 0;text-align:left;min-height:62px;padding:9px 11px}.icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#f0f0f7;font-size:12px}.step strong,.step small{display:block;overflow-wrap:anywhere}.state{font-size:11px;color:#4b6575;white-space:nowrap}.fail{color:#ae2437}.ok{color:#187157}.wait{color:#86571b}.jump{position:absolute;bottom:14px;right:19px;box-shadow:0 3px 14px #23223a24}.detail h2{margin:12px 0 5px}.detail .actions{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.section{margin:16px 0}.section summary{cursor:pointer;font-weight:600}.section pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6fa;border:1px solid var(--line);padding:10px;border-radius:8px}.round{padding:3px 0}.round>summary{cursor:pointer;color:var(--muted);font-size:12px}.empty{padding:22px 0;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:880px){.layout{grid-template-columns:175px minmax(0,1fr) 245px}.side,.detail,.top,.scroll{padding-left:12px;padding-right:12px}}
@media(max-width:650px){.header-note{display:none}.layout{display:block;height:auto}.side,.detail{border:0}.side{max-height:265px}.scroll{height:360px;flex:auto}.detail{min-height:220px}.jump{bottom:12px}}
</style>
<header><span class="mark" aria-hidden="true">A</span><strong>AgentLens</strong><span class="badge">交互原型 · 模拟日志</span><span class="header-note">本地演示</span></header>
<div class="layout">
<aside class="side" aria-label="会话"><h2>会话</h2><div class="filters"><input id="project" placeholder="筛选项目" aria-label="筛选项目"><select id="provider" aria-label="代理来源"><option value="">所有来源</option><option>Codex</option><option>Claude Code</option></select></div><div id="sessions"></div><p class="tip">从失败步骤出发，能否快速找到相关修改并看见重跑结果？选一个会话试走一遍。</p></aside>
<main>
<div class="top"><h1 id="title"></h1><p class="muted" id="meta" aria-live="polite"></p><div class="toolbar"><button id="play" class="primary">播放后续日志</button><button id="next">单步写入</button><button id="reset">重置</button><button id="failed" aria-pressed="false">只看失败</button><button id="file" hidden></button></div></div>
<div id="timeline" class="scroll" aria-label="执行时间线"><details class="round" id="round" open><summary>任务轮次 · 修复构建</summary><div id="steps"></div></details></div><button id="jump" class="jump primary" hidden></button>
</main>
<aside id="detail" class="detail" aria-label="步骤详情"></aside>
</div>
<script>
const sources = [
  {provider:'Codex', project:'workspace-web', title:'修复构建类型错误', path:'src/config.ts', command:'npm run build', time:'14:32'},
  {provider:'Claude Code', project:'inventory-cli', title:'修复配置解析失败', path:'src/settings.ts', command:'npm test', time:'14:19'}
];
function scenario(source) {
  const {path, command} = source;
  return [
    {id:1, kind:'消息', title:'修复失败的检查，并重新运行验证。', state:'已记录'},
    {id:10, kind:'读取', title:'package.json', path:'package.json', content:'{ "scripts": { "build": "tsc --noEmit" } }', state:'成功'},
    {id:11, kind:'读取', title:'tsconfig.json', path:'tsconfig.json', content:'{ "compilerOptions": { "strict": true } }', state:'成功'},
    {id:12, kind:'读取', title:'src/index.ts', path:'src/index.ts', content:'import { config } from "./config";', state:'成功'},
    {id:2, kind:'读取', title:path, path, content:'export const config = { port: 3000 };', state:'成功'},
    {id:3, kind:'修改', title:path, path, patch:'- port: 3000\n+ port: "3000"', state:'成功'},
    {id:4, kind:'命令', title:command, command, path, output:path+'(8,3): error TS2322: Type \'string\' is not assignable to type \'number\'.', exit:1, state:'失败'},
    {id:5, kind:'修改', title:path, path, patch:'- port: "3000"\n+ port: 3000', state:'等待结果'},
    {target:5, result:{state:'成功',output:'已写入 1 个文件'}},
    {id:6, kind:'命令', title:command, command, state:'等待结果'},
    {target:6, result:{state:'成功',exit:0,output:'Checks passed.'}}
  ];
}
function replay(records, count) {
  return records.slice(0,count).reduce((steps, record) => record.target
    ? steps.map(step => step.id===record.target ? {...step,...record.result} : step)
    : [...steps,record], []);
}
const $ = id => document.getElementById(id);
const display = {active:0, selected:4, failed:false, file:null, unseen:0, timer:null};
const initialCount = 7;
const counts = sources.map(() => initialCount);
const logs = sources.map(scenario);
const node = (tag, value, cls) => {const e=document.createElement(tag); if(value!==undefined)e.textContent=value; if(cls)e.className=cls; return e;};
const rows = () => replay(logs[display.active], counts[display.active]);
const atBottom = () => $('timeline').scrollHeight-$('timeline').scrollTop-$('timeline').clientHeight<=12;
function updateJump() {
  $('jump').hidden=!display.unseen;
  $('jump').textContent='有 '+display.unseen+' 个新步骤 ↓';
}
function goBottom() { $('timeline').scrollTop=$('timeline').scrollHeight; display.unseen=0; updateJump(); }
function stop() {clearInterval(display.timer);display.timer=null;}
function sessions() {
  const container=$('sessions');
  container.replaceChildren();
  sources.forEach((source,i) => {
    if (($('provider').value && $('provider').value!==source.provider) ||
      !source.project.includes($('project').value.trim().toLowerCase())) return;
    const button=node('button',undefined,'session');
    button.setAttribute('aria-pressed',String(i===display.active));
    button.append(node('span',source.provider+' · '+source.time,'source'),node('strong',source.title),node('small',source.project));
    button.onclick=()=>{stop();Object.assign(display,{active:i,selected:4,file:null,failed:false,unseen:0});$('round').open=true;render();goBottom();};
    container.append(button);
  });
  if(!container.children.length)container.append(node('p','未找到匹配的会话','empty'));
}
function showStep(id) {
  display.selected=id;display.failed=false;display.file=null;$('round').open=true;
  render();
  $('step-'+id)?.scrollIntoView({block:'nearest'});
  $('step-'+id)?.focus({preventScroll:true});
}
function section(label,content,open=false) {
  const e=node('details',undefined,'section');e.open=open;e.append(node('summary',label),node('pre',content));return e;
}
function details(steps) {
  const pane=$('detail'), step=steps.find(row=>row.id===display.selected);
  pane.replaceChildren(node('small','步骤详情'));
  if(!step){pane.append(node('p','选择一个工具步骤查看记录。','empty'));return;}
  pane.append(node('h2',step.title),node('p',step.kind+' · '+step.state,step.state==='失败'?'fail':'muted'));
  const actions=node('div',undefined,'actions');
  if(step.state==='失败') {
    const previous=steps.filter(row=>row.id<step.id && row.kind==='修改' && row.path===step.path).at(-1);
    if(previous){const jump=node('button','查看前一次修改 ↑');jump.onclick=()=>showStep(previous.id);actions.append(jump);}
  }
  if(step.path){const filter=node('button','查看本轮同文件步骤');filter.onclick=()=>{display.file=step.path;display.failed=false;render();};actions.append(filter);}
  pane.append(actions);
  if(step.command)pane.append(section('命令',step.command,true));
  if(step.exit!==undefined)pane.append(node('p','退出码 '+step.exit,step.exit===0?'ok':'fail'));
  if(step.output)pane.append(section('工具输出',step.output,step.state==='失败'));
  if(step.patch)pane.append(section('补丁',step.patch,true));
  if(step.content)pane.append(section('读取结果',step.content,true));
}
let detailKey='';
function render() {
  const source=sources[display.active], steps=rows(), done=counts[display.active]===logs[display.active].length;
  $('title').textContent=source.title;
  $('meta').textContent=source.provider+' / '+source.project+' · '+steps.length+' 条记录 · '+(done?'演示结束':display.timer?'正在播放':'可继续演示');
  $('play').textContent=display.timer?'暂停播放':'播放后续日志';
  $('play').disabled=done;$('next').disabled=done;
  $('failed').setAttribute('aria-pressed',String(display.failed));
  $('file').hidden=!display.file;$('file').textContent=(display.file??'')+' ×';
  sessions();
  const container=$('steps');
  const visible=steps.filter(step=>(!display.failed || step.state==='失败') && (!display.file || step.path===display.file));
  const stale=new Set([...container.children].map(e=>e.id));
  visible.forEach((step,i)=>{
    const id='step-'+step.id;stale.delete(id);
    let e=$(id);
    if(!e){e=node('button',undefined,'step');e.id=id;e.onclick=()=>{display.selected=step.id;render();};}
    const stateClass=({失败:'fail',成功:'ok',等待结果:'wait'})[step.state]??'';
    const label=node('span');
    label.append(node('strong',step.title),node('small',step.kind));
    if(e.dataset.state!==step.state){e.replaceChildren(node('span',step.kind[0],'icon'),label,node('span',step.state,'state '+stateClass));e.dataset.state=step.state;}
    e.setAttribute('aria-pressed',String(step.id===display.selected));
    if(container.children[i]!==e)container.insertBefore(e,container.children[i]??null);
  });
  for(const id of stale)container.querySelector(id?'#'+id:'.empty')?.remove();
  if(!visible.length)container.append(node('p','没有符合筛选条件的步骤','empty'));
  const key=JSON.stringify([display.active,steps.find(step=>step.id===display.selected)]);
  if(detailKey!==key){detailKey=key;details(steps);}
  updateJump();
}
function advance(){
  const index=display.active, record=logs[index][counts[index]];
  if(!record)return;
  const follow=atBottom();
  counts[index]++;
  if(!follow && !record.target)display.unseen++;
  if(counts[index]===logs[index].length)stop();
  render();if(follow)goBottom();
}
$('project').oninput=sessions;$('provider').onchange=sessions;
$('next').onclick=advance;
$('play').onclick=()=>{if(display.timer)stop();else display.timer=setInterval(advance,1100);render();};
$('reset').onclick=()=>{stop();counts[display.active]=initialCount;Object.assign(display,{selected:4,file:null,failed:false,unseen:0});$('round').open=true;render();goBottom();};
$('failed').onclick=()=>{display.failed=!display.failed;display.file=null;render();};
$('file').onclick=()=>{display.file=null;render();};
$('jump').onclick=goBottom;
$('timeline').addEventListener('scroll',()=>{if(atBottom()&&display.unseen){display.unseen=0;updateJump();}});
render();
</script>
</html>
